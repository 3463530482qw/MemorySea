; 字体标签:[字体.名字] 一节一个字体
;   px  = 烘焙像素(SDF 距离场分辨率,图集边长 = px*32)
;   pad = 边缘留白(em),描边宽别超过它,否则描边被裁剪
[字体.主字体]
主字体 = font/LXGWWenKaiLite-Light.ttf
px = 96
pad = 0.1

[字体.二号字体]
二号字体 = font/LXGWWenKaiLite-Light.ttf
px = 96
pad = 0.1

; 命令标签:font 按名字取字体;outlineW 是 em(相对 fontSize)
[命令1]
font = 主字体
text = 描边效果测试
x = 100
y = 100
fontSize = 96
rotate = 0
rox = 0
roy = 0
r = 1
g = 1
b = 1
a = 1
order = 1
outline = true
outlineW = 0.05
outlineR = 1
outlineG = 0.45
outlineB = 0.1
outlineA = 1

[命令2]
font = 主字体
text = 无描边对照
x = 100
y = 300
fontSize = 96
rotate = 0
rox = 0
roy = 0
r = 1
g = 1
b = 1
a = 1
order = 1

[命令3]
font = 二号字体
text = 多字体描边喵
x = 100
y = 500
fontSize = 96
rotate = 0
rox = 0
roy = 0
r = 1
g = 1
b = 1
a = 1
order = 1
outline = true
outlineW = 0.03
outlineR = 0.3
outlineG = 0.6
outlineB = 1
outlineA = 1
